<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מערכת לתיאום זיכוי מעונות</title>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            /* משתני צבע למצב בהיר */
            --primary-color: #4338ca;
            --primary-hover: #3730a3;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --success-color: #10b981;
            --tenant-bg: #f8fafc;
        }

        /* תמיכה אוטומטית ב-Dark Mode */
        @media (prefers-color-scheme: dark) {
            :root {
                --primary-color: #6366f1;
                --primary-hover: #4f46e5;
                --bg-color: #111827;
                --card-bg: #1f2937;
                --text-main: #f9fafb;
                --text-muted: #9ca3af;
                --border-color: #374151;
                --tenant-bg: #374151;
            }
            
            input, select, textarea {
                background-color: #1f2937 !important;
                color: var(--text-main) !important;
                border-color: var(--border-color) !important;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Rubik', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 800px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 20px;
        }

        .header h1 {
            color: var(--primary-color);
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 15px;
        }

        .form-section-title {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 15px;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 25px;
        }

        .form-section-title::before {
            content: "";
            display: block;
            width: 8px;
            height: 8px;
            background-color: var(--primary-color);
            border-radius: 50%;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 10px;
        }
        
        .tenant-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            background-color: var(--tenant-bg);
            padding: 15px;
            border-radius: 8px;
            border: 1px dashed var(--text-muted);
            margin-bottom: 15px;
        }

        /* הסתרת דיירים 2-6 כברירת מחדל */
        #tenant-row-2, #tenant-row-3, #tenant-row-4, #tenant-row-5, #tenant-row-6 {
            display: none;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            font-size: 14px;
            font-weight: 500;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-family: inherit;
            font-size: 15px;
            transition: all 0.2s ease;
            background-color: #ffffff;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        input:invalid:not(:placeholder-shown), select:invalid:not(:placeholder-shown) {
            border-color: #ef4444;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .submit-btn, .add-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .submit-btn {
            padding: 16px 24px;
            font-size: 16px;
            width: 100%;
            margin-top: 30px;
        }

        .add-btn {
            padding: 10px 15px;
            font-size: 14px;
            margin-bottom: 20px;
            background-color: var(--text-muted);
        }

        .add-btn:hover { background-color: var(--text-main); }
        .submit-btn:hover { background-color: var(--primary-hover); }
        
        .submit-btn:disabled {
            background-color: var(--text-muted);
            cursor: not-allowed;
        }

        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .success-message {
            display: none;
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--success-color);
            border: 1px solid var(--success-color);
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            margin-top: 20px;
            font-weight: 500;
        }

        .success-message.active {
            display: block;
        }
        
        .tenant-label {
            grid-column: 1 / -1;
            font-size: 14px;
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: -5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>תיאום זיכוי מעונות</h1>
            <p>מלא את פרטי הזיכוי. המערכת תעדכן את הגליון ותיצור פגישה ביומן.</p>
        </div>

        <form id="creditForm">
            <div class="form-section-title">פרטי הפגישה</div>
            <div class="form-grid">
                <div class="form-group full-width">
                    <label for="taskName">כותרת הפגישה ביומן *</label>
                    <input type="text" id="taskName" name="taskName" placeholder="לדוגמה: זיכוי דירה 931/3/1 - איתי סולומון" required>
                </div>
                
                <div class="form-group full-width">
                    <label for="dateTime">תאריך ושעת הזיכוי *</label>
                    <select id="dateTime" name="dateTime" required>
                        <option value="">-- בחר מועד מהרשימה --</option>
                        <option value="2026-07-08T08:00:00,2026-07-08T08:30:00">תאריך: 08/07/2026 שעות: 8:00 עד 8:30</option>
                        <option value="2026-07-16T09:00:00,2026-07-16T09:30:00">תאריך: 16/07/2026 שעות: 9:00 עד 9:30</option>
                        <option value="2026-07-16T09:30:00,2026-07-16T10:00:00">תאריך: 16/07/2026 שעות: 9:30 עד 10:00</option>
                        <option value="2026-08-01T08:00:00,2026-08-01T09:30:00">תאריך: 01/08/2026 שעות: 8:00 עד 9:30</option>
                        <option value="2026-08-01T09:30:00,2026-08-01T10:00:00">תאריך: 01/08/2026 שעות: 9:30 עד 10:00</option>
                        <option value="2026-08-01T10:00:00,2026-08-01T10:30:00">תאריך: 01/08/2026 שעות: 10:00 עד 10:30</option>
                        <option value="2026-08-20T08:30:00,2026-08-20T09:00:00">תאריך: 20/08/2026 שעות: 8:30 עד 9:00 בבוקר</option>
                        <option value="2026-08-20T08:30:00,2026-08-20T09:30:00">תאריך: 20/08/2026 שעות: 8:30 עד 9:30 בבוקר</option>
                        <option value="2026-08-20T09:30:00,2026-08-20T10:00:00">תאריך: 20/08/2026 שעות: 9:30 עד 10:00 בבוקר</option>
                        <option value="2026-08-20T10:00:00,2026-08-20T12:00:00">שעה אחרונה 20/08/2026 שעות: 10:00 עד 12:00</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="apartment">מספר דירה (בפורמט XXX/X/X) *</label>
                    <input type="text" id="apartment" name="apartment" placeholder="לדוגמה: 931/3/1" pattern="^[0-9]{3,4}/[0-9]{1,2}/[0-9]{1,2}$" title="חובה להזין בפורמט המדויק. לדוגמה: 931/3/1" required>
                </div>
            </div>
            
            <div class="form-section-title">פרטי עזיבה</div>
            <div class="form-grid">
                <div class="form-group">
                    <label for="leaveStatus">סטטוס עזיבה *</label>
                    <select id="leaveStatus" name="leaveStatus" required onchange="toggleOtherDorm(this.value)">
                        <option value="">-- בחר סטטוס --</option>
                        <option value="עוזב">עוזב</option>
                        <option value="עובר בתוך קנדה">עובר בתוך קנדה</option>
                        <option value="עובר למעון אחר">עובר למעון אחר</option>
                    </select>
                </div>
                <div class="form-group full-width" id="otherDormContainer" style="display: none;">
                    <label for="otherDorm">לאיזה מעון? *</label>
                    <input type="text" id="otherDorm" name="otherDorm" placeholder="ציין את שם המעון">
                </div>
            </div>

            <div class="form-section-title">פרטי הדיירים המזדכים</div>
            
            <div id="tenants-wrapper">
                <div class="tenant-row" id="tenant-row-1">
                    <div class="tenant-label">דייר 1</div>
                    <div class="form-group">
                        <label for="name1">שם מזכה</label>
                        <input type="text" id="name1" name="name1" placeholder="שם מלא">
                    </div>
                    <div class="form-group">
                        <label for="id1">תעודת זהות</label>
                        <input type="text" id="id1" name="id1" placeholder="9 ספרות" pattern="\d{9}" title="חייב להכיל 9 ספרות בדיוק">
                    </div>
                </div>
                <div class="tenant-row" id="tenant-row-2">
                    <div class="tenant-label">דייר 2</div>
                    <div class="form-group">
                        <label for="name2">שם מזכה</label>
                        <input type="text" id="name2" name="name2">
                    </div>
                    <div class="form-group">
                        <label for="id2">תעודת זהות</label>
                        <input type="text" id="id2" name="id2" pattern="\d{9}">
                    </div>
                </div>
                <div class="tenant-row" id="tenant-row-3">
                    <div class="tenant-label">דייר 3</div>
                    <div class="form-group">
                        <label for="name3">שם מזכה</label>
                        <input type="text" id="name3" name="name3">
                    </div>
                    <div class="form-group">
                        <label for="id3">תעודת זהות</label>
                        <input type="text" id="id3" name="id3" pattern="\d{9}">
                    </div>
                </div>
                <div class="tenant-row" id="tenant-row-4">
                    <div class="tenant-label">דייר 4</div>
                    <div class="form-group">
                        <label for="name4">שם מזכה</label>
                        <input type="text" id="name4" name="name4">
                    </div>
                    <div class="form-group">
                        <label for="id4">תעודת זהות</label>
                        <input type="text" id="id4" name="id4" pattern="\d{9}">
                    </div>
                </div>
                <div class="tenant-row" id="tenant-row-5">
                    <div class="tenant-label">דייר 5</div>
                    <div class="form-group">
                        <label for="name5">שם מזכה</label>
                        <input type="text" id="name5" name="name5">
                    </div>
                    <div class="form-group">
                        <label for="id5">תעודת זהות</label>
                        <input type="text" id="id5" name="id5" pattern="\d{9}">
                    </div>
                </div>
                <div class="tenant-row" id="tenant-row-6">
                    <div class="tenant-label">דייר 6</div>
                    <div class="form-group">
                        <label for="name6">שם מזכה</label>
                        <input type="text" id="name6" name="name6">
                    </div>
                    <div class="form-group">
                        <label for="id6">תעודת זהות</label>
                        <input type="text" id="id6" name="id6" pattern="\d{9}">
                    </div>
                </div>
            </div>
            
            <button type="button" id="addTenantBtn" class="add-btn" onclick="addTenantRow()">+ הוסף דייר נוסף</button>

            <div class="form-section-title">מידע נוסף</div>
            <div class="form-grid">
                <div class="form-group full-width">
                    <label for="notes">הערות ליומן ולגליון (אופציונלי)</label>
                    <textarea id="notes" name="notes" placeholder="פרטים נוספים למפקח, חוסרים בדירה וכו'..."></textarea>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="submit-btn">
                <span>קבע פגישה ושמור בגליון</span>
                <div class="spinner" id="spinner"></div>
            </button>
        </form>

        <div class="success-message" id="successMsg">
            הפגישה נקבעה בהצלחה! היומן והגליון עודכנו. 🎉
        </div>
    </div>

    <script>
        // הכנס כאן את הלינק המעודכן מה-Deploy החדש בגוגל
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwsU74pzwY8yP8dxzdujZOfX1cqDBd46OAdHacNUV3Ujy90GRHUfSw_LfGgLbOeAXo/exec'; 

        // לוגיקת הצגת שדות הדיור
        let currentTenantCount = 1;
        function addTenantRow() {
            if (currentTenantCount < 6) {
                currentTenantCount++;
                document.getElementById(`tenant-row-${currentTenantCount}`).style.display = 'grid';
            }
            if (currentTenantCount === 6) {
                document.getElementById('addTenantBtn').style.display = 'none';
            }
        }

        // לוגיקת מעון אחר
        function toggleOtherDorm(value) {
            const container = document.getElementById('otherDormContainer');
            const input = document.getElementById('otherDorm');
            if (value === 'עובר למעון אחר') {
                container.style.display = 'block';
                input.required = true;
            } else {
                container.style.display = 'none';
                input.required = false;
                input.value = '';
            }
        }

        // טיפול בשליחת הטופס (Submission)
        const form = document.getElementById('creditForm');
        const submitBtn = document.getElementById('submitBtn');
        const spinner = document.getElementById('spinner');
        const btnText = submitBtn.querySelector('span');
        const successMsg = document.getElementById('successMsg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            submitBtn.disabled = true;
            spinner.style.display = 'block';
            btnText.textContent = 'שומר נתונים...';
            successMsg.classList.remove('active');

            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());

            // לקיחת הטקסט של השעה
            const dateTimeSelect = document.getElementById('dateTime');
            data.dateTimeLabel = dateTimeSelect.options[dateTimeSelect.selectedIndex].text;

            // עיבוד ההערות וסטטוס העזיבה
            let combinedNotes = `סטטוס עזיבה: ${data.leaveStatus}\n`;
            if (data.leaveStatus === 'עובר למעון אחר') {
                combinedNotes += `עובר ל: ${data.otherDorm}\n`;
            }
            if (data.notes && data.notes.trim() !== '') {
                combinedNotes += `\nהערות נוספות:\n${data.notes}`;
            }
            data.combinedNotes = combinedNotes;

            try {
                if (GOOGLE_SCRIPT_URL === 'YOUR_WEB_APP_URL_HERE') {
                    console.log("Mock submission (Update the URL!):", data);
                    await new Promise(resolve => setTimeout(resolve, 1000));
                } else {
                    const response = await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify(data),
                        headers: {
                            'Content-Type': 'text/plain;charset=utf-8',
                        }
                    });
                    const result = await response.json();
                    if(result.status !== 'success') throw new Error(result.message || 'Server Error');
                }

                successMsg.classList.add('active');
                form.reset();
                toggleOtherDorm('');
                
                // איפוס תצוגת דיירים
                for(let i = 2; i <= 6; i++) {
                    document.getElementById(`tenant-row-${i}`).style.display = 'none';
                }
                currentTenantCount = 1;
                document.getElementById('addTenantBtn').style.display = 'flex';

            } catch (error) {
                alert('אירעה שגיאה בשמירת הנתונים. ודא שחיברת את ה-URL כראוי.');
                console.error(error);
            } finally {
                submitBtn.disabled = false;
                spinner.style.display = 'none';
                btnText.textContent = 'קבע פגישה ושמור בגליון';
                
                setTimeout(() => {
                    successMsg.classList.remove('active');
                }, 6000);
            }
        });
    </script>
</body>
</html>
