<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מערכת לתיאום זיכוי מעונות</title>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>תיאום זיכוי מעונות</h1>
            <p>מלא את פרטי הזיכוי. המערכת תעדכן את הגליון ותיצור פגישה ביומן.</p>
        </div>

        <form id="creditForm">
            <div class="form-section-title">פרטי הפגישה</div>
            <div class="form-grid">
                <div class="form-group full-width">
                    <label for="taskName">כותרת הפגישה ביומן *</label>
                    <input type="text" id="taskName" name="taskName" placeholder="לדוגמה: זיכוי דירה 931/3/1 - איתי סולומון" required>
                </div>
                
                <div class="form-group full-width">
                    <label for="dateTime">תאריך ושעת הזיכוי *</label>
                    <select id="dateTime" name="dateTime" required>
                        <option value="">-- בחר מועד מהרשימה --</option>
                        </select>
                </div>

                <div class="form-group">
                    <label for="apartment">מספר דירה (בפורמט XXX/X/X) *</label>
                    <input type="text" id="apartment" name="apartment" placeholder="לדוגמה: 931/3/1" pattern="^[0-9]{3,4}/[0-9]{1,2}/[0-9]{1,2}$" title="חובה להזין בפורמט המדויק. לדוגמה: 931/3/1" required>
                </div>
            </div>
            
            <div class="form-section-title">פרטי עזיבה</div>
            <div class="form-grid">
                <div class="form-group">
                    <label for="leaveStatus">סטטוס עזיבה *</label>
                    <select id="leaveStatus" name="leaveStatus" required>
                        <option value="">-- בחר סטטוס --</option>
                        <option value="עוזב">עוזב</option>
                        <option value="עובר בתוך קנדה">עובר בתוך קנדה</option>
                        <option value="עובר למעון אחר">עובר למעון אחר</option>
                    </select>
                </div>
                <div class="form-group full-width" id="otherDormContainer" style="display: none;">
                    <label for="otherDorm">לאיזה מעון? *</label>
                    <input type="text" id="otherDorm" name="otherDorm" placeholder="ציין את שם המעון">
                </div>
            </div>

            <div class="form-section-title">פרטי הדיירים המזדכים</div>
            
            <div id="tenants-wrapper">
                <div class="tenant-row" id="tenant-row-1">
                    <div class="tenant-label">דייר 1</div>
                    <div class="form-group">
                        <label for="name1">שם מזכה</label>
                        <input type="text" id="name1" name="name1" placeholder="שם מלא">
                    </div>
                    <div class="form-group">
                        <label for="id1">תעודת זהות</label>
                        <input type="text" id="id1" name="id1" placeholder="9 ספרות" pattern="\d{9}" title="חייב להכיל 9 ספרות בדיוק">
                    </div>
                </div>
                <div class="tenant-row" id="tenant-row-2">
                    <div class="tenant-label">דייר 2</div>
                    <div class="form-group">
                        <label for="name2">שם מזכה</label>
                        <input type="text" id="name2" name="name2">
                    </div>
                    <div class="form-group">
                        <label for="id2">תעודת זהות</label>
                        <input type="text" id="id2" name="id2" pattern="\d{9}">
                    </div>
                </div>
                <div class="tenant-row" id="tenant-row-3">
                    <div class="tenant-label">דייר 3</div>
                    <div class="form-group">
                        <label for="name3">שם מזכה</label>
                        <input type="text" id="name3" name="name3">
                    </div>
                    <div class="form-group">
                        <label for="id3">תעודת זהות</label>
                        <input type="text" id="id3" name="id3" pattern="\d{9}">
                    </div>
                </div>
                <div class="tenant-row" id="tenant-row-4">
                    <div class="tenant-label">דייר 4</div>
                    <div class="form-group">
                        <label for="name4">שם מזכה</label>
                        <input type="text" id="name4" name="name4">
                    </div>
                    <div class="form-group">
                        <label for="id4">תעודת זהות</label>
                        <input type="text" id="id4" name="id4" pattern="\d{9}">
                    </div>
                </div>
                <div class="tenant-row" id="tenant-row-5">
                    <div class="tenant-label">דייר 5</div>
                    <div class="form-group">
                        <label for="name5">שם מזכה</label>
                        <input type="text" id="name5" name="name5">
                    </div>
                    <div class="form-group">
                        <label for="id5">תעודת זהות</label>
                        <input type="text" id="id5" name="id5" pattern="\d{9}">
                    </div>
                </div>
                <div class="tenant-row" id="tenant-row-6">
                    <div class="tenant-label">דייר 6</div>
                    <div class="form-group">
                        <label for="name6">שם מזכה</label>
                        <input type="text" id="name6" name="name6">
                    </div>
                    <div class="form-group">
                        <label for="id6">תעודת זהות</label>
                        <input type="text" id="id6" name="id6" pattern="\d{9}">
                    </div>
                </div>
            </div>
            
            <button type="button" id="addTenantBtn" class="add-btn">+ הוסף דייר נוסף</button>

            <div class="form-section-title">מידע נוסף</div>
            <div class="form-grid">
                <div class="form-group full-width">
                    <label for="notes">הערות ליומן ולגליון (אופציונלי)</label>
                    <textarea id="notes" name="notes" placeholder="פרטים נוספים למפקח, חוסרים בדירה וכו'..."></textarea>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="submit-btn">
                <span>קבע פגישה ושמור בגליון</span>
                <div class="spinner" id="spinner"></div>
            </button>
        </form>

        <div class="success-message" id="successMsg">
            הפגישה נקבעה בהצלחה! היומן והגליון עודכנו. 🎉
        </div>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
